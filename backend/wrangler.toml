name = "growl-backend"
main = "src/index.ts"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

# Local wrangler dev (port used by npm run test:local)
[dev]
port = 8787

# ---------------------------------------------------------------------------
# Default / local bindings (used by `wrangler dev` without --env)
# Company Cloudflare account (admin@letsgrow.lu / b98d4f2eafd8dc9db7ee6b2755ac02ab)
# Secrets: `.dev.vars` locally, `wrangler secret put --env <env>` remotely.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "growl-db-dev"
database_id = "d8f27281-2230-402c-9ca5-622da947c436"

[[kv_namespaces]]
binding = "KV"
id = "e614800d570f45b1abead81eee44f111"
preview_id = "e614800d570f45b1abead81eee44f111"

[[r2_buckets]]
binding = "R2"
bucket_name = "growl-media-dev"

[vars]
ENVIRONMENT = "development"
API_VERSION = "v1"
CORS_ORIGINS = "*"

# ---------------------------------------------------------------------------
# Remote envs: isolated D1 / KV / R2
# KV: growl-backend-KV_DEV | KV_QA | KV_PROD
# ---------------------------------------------------------------------------

[env.dev]
name = "growl-backend-dev"
vars = { ENVIRONMENT = "development", API_VERSION = "v1", CORS_ORIGINS = "*" }

[[env.dev.d1_databases]]
binding = "DB"
database_name = "growl-db-dev"
database_id = "d8f27281-2230-402c-9ca5-622da947c436"

[[env.dev.kv_namespaces]]
binding = "KV"
id = "e614800d570f45b1abead81eee44f111"
preview_id = "e614800d570f45b1abead81eee44f111"

[[env.dev.r2_buckets]]
binding = "R2"
bucket_name = "growl-media-dev"

[env.qa]
name = "growl-backend-qa"
vars = { ENVIRONMENT = "qa", API_VERSION = "v1", CORS_ORIGINS = "*" }

[[env.qa.d1_databases]]
binding = "DB"
database_name = "growl-db-qa"
database_id = "6a8f9ac6-25a9-4c5b-86d4-7c47ecb86dcc"

[[env.qa.kv_namespaces]]
binding = "KV"
id = "ee718b42c43049ba8987d63b13f2bd82"
preview_id = "ee718b42c43049ba8987d63b13f2bd82"

[[env.qa.r2_buckets]]
binding = "R2"
bucket_name = "growl-media-qa"

[env.production]
name = "growl-backend-production"
vars = { ENVIRONMENT = "production", API_VERSION = "v1", CORS_ORIGINS = "https://letsgrow.lu,https://www.letsgrow.lu,https://growl.app,https://www.growl.app,https://admin.growl.app" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "growl-db-prod"
database_id = "0c99eb86-899f-43cb-8060-62c03cc6ef13"

[[env.production.kv_namespaces]]
binding = "KV"
id = "a8ab7ccfebc548bb99eba5517b636d74"

[[env.production.r2_buckets]]
binding = "R2"
bucket_name = "growl-media-prod"
